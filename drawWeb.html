<!DOCTYPE html>
<html>
<head>
  <title>FlowgorithmJS offline</title>
  <meta charset="utf-8">
  <script src="lib/jquery-3.7.1.min.js"></script>
  <script src="flowgorithm.js?100"></script>
  <script>
    let config = {itMode:2};
    $(function(){
        FlogorithmJS.drawFromUrl('fprg/max3numbers.fprg','#f1',config);
        //use await to wait for the drawing to complete
        //ex. await FlogorithmJS.drawFlowchartFromUrl('fprg/max3numbers.fprg','#f1',config);
        FlogorithmJS.drawFromUrl('fprg/next.fprg','#f2',config);
    });
  </script>
  <style>
    h1{font-size:1.2em}
    div.f{width:49%;float:left;position:relative}
  </style>
</head>
<body>
    <h1>FlowgorithmJS - Example of use</h1>
    <div class="f">
        <div id="f1"></div>
        <div id="xml1"></div>
    </div>
    <div class="f">
        <div id="f2"></div>
        <div id="xml2"></div>
    </div>
</body>
</html>
